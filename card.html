<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d37">
  <meta name="description" content="세 장의 선불카드 사용내역과 남은 금액을 간편하게 기록하세요.">
  <title>세 장의 카드 · 사용내역</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123d37'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='%23c5f277'/%3E%3Cpath d='M6 14h20' stroke='%23123d37' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    .card-title-number{font-size:30px;font-weight:800;letter-spacing:1.5px;line-height:1.2}
    .card-top+.balance-label{margin-top:27px}
    .card-list-heading{margin-top:48px}
    .card .balance-label{font-weight:650;opacity:.85}
    .card .balance{font-size:40px}
    .history-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .number-help{color:#6f7f78;font-size:15px;line-height:1.7;margin:0 0 26px}
    .number-input{width:100%;margin-top:10px;padding:17px 16px;border:1px solid #dce3dd;border-radius:10px;font-size:27px;font-weight:700;letter-spacing:8px;text-align:center;color:#193e2f}
    .number-input:focus{outline:2px solid #4d8764;border-color:transparent}
    #number-error{font-size:14px;color:#b13b37;min-height:20px;margin:13px 0;line-height:1.5}
    @media(max-width:760px){.card-list-heading{margin-top:32px}.cards{grid-template-columns:1fr;gap:12px}.card{padding:24px 22px}.card-title-number{font-size:28px;letter-spacing:2px}.card-top+.balance-label{margin-top:27px}.card .balance-label{font-size:14px}.card .balance{font-size:36px}.card-bottom{flex-direction:row}.history-heading{align-items:stretch;flex-direction:column}.history-actions{max-width:none;width:100%;justify-content:stretch}.history-actions .secondary{flex:1;padding:10px;font-size:12px}}
  </style>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">▰</span> 세 장의 카드</a><span class="header-label">선불카드 사용 기록</span></header>
    <main>
      <div class="section-heading card-list-heading"><h2>내 카드 <span>3</span></h2><span>카드를 누르면 바로 입력할 수 있어요</span></div>
      <div class="cards" role="tablist" aria-label="선불카드 선택">
        <button class="card card-1" id="tab-0" role="tab" aria-selected="false" aria-controls="history" data-card="0"><span class="card-top"><span class="card-title-number" data-card-title="0">카드번호 미등록</span></span><span class="balance-label">남은 금액</span><span class="balance" data-balance="0">100,000<small>원</small></span><span class="meter"><span data-meter="0"></span></span><span class="card-bottom"><span data-spent="0">사용 0원</span><span>금액 입력 ↗</span></span></button>
        <button class="card card-2" id="tab-1" role="tab" aria-selected="false" aria-controls="history" data-card="1"><span class="card-top"><span class="card-title-number" data-card-title="1">카드번호 미등록</span></span><span class="balance-label">남은 금액</span><span class="balance" data-balance="1">100,000<small>원</small></span><span class="meter"><span data-meter="1"></span></span><span class="card-bottom"><span data-spent="1">사용 0원</span><span>금액 입력 ↗</span></span></button>
        <button class="card card-3" id="tab-2" role="tab" aria-selected="false" aria-controls="history" data-card="2"><span class="card-top"><span class="card-title-number" data-card-title="2">카드번호 미등록</span></span><span class="balance-label">남은 금액</span><span class="balance" data-balance="2">100,000<small>원</small></span><span class="meter"><span data-meter="2"></span></span><span class="card-bottom"><span data-spent="2">사용 0원</span><span>금액 입력 ↗</span></span></button>
      </div>
      <section class="history" id="history" role="tabpanel" aria-labelledby="tab-0" hidden><div class="history-heading"><div><p class="eyebrow" id="history-card">CARD 01</p><h2>사용내역 <span id="count">0건</span></h2></div><div class="history-actions"><button class="secondary" id="edit-card-number">카드번호 등록</button><button class="secondary" id="add-entry">＋ 금액 입력</button></div></div><div id="entries"></div></section>
      <section class="welcome" id="welcome"><span class="welcome-symbol" aria-hidden="true">＋</span><h2>어떤 카드를 사용하셨나요?</h2><p>위에서 카드를 선택하면 사용내역과 잔액을 확인할 수 있어요.</p></section>
      <p class="storage-note" id="storage-note" role="status">공유 저장소 연결 상태를 확인하고 있습니다.</p>
    </main><footer><span>세 장의 카드</span><span>작은 기록, 쉬운 잔액 관리.</span></footer>
  </div>
  <dialog id="entry-dialog" aria-labelledby="dialog-title"><form id="entry-form" novalidate><div class="dialog-top"><span class="pill" id="dialog-card">카드 01</span><button class="close" type="button" aria-label="입력창 닫기" id="close-dialog">✕</button></div><h2 id="dialog-title">얼마 사용하셨나요?</h2><p class="available">현재 잔액 <strong id="available">100,000원</strong></p><label for="amount" class="input-label">사용 금액</label><div class="amount-wrap"><input id="amount" name="amount" type="text" inputmode="numeric" pattern="[0-9,]*" placeholder="0" autocomplete="off" maxlength="9" autofocus aria-describedby="form-error"><span>원</span></div><div class="quick-amounts"><button type="button" data-add="1000">+1,000</button><button type="button" data-add="5000">+5,000</button><button type="button" data-add="10000">+10,000</button><button type="button" id="clear-amount">지우기</button></div><label for="memo" class="input-label memo-label">사용처 또는 메모 <span>선택</span></label><input id="memo" maxlength="60" placeholder="예: 점심 식사, 편의점" autocomplete="off"><p class="after-balance">기록 후 남은 금액 <strong id="after-balance">100,000원</strong></p><p id="form-error" role="alert"></p><button class="submit" type="submit">사용 금액 기록하기</button></form></dialog>
  <dialog id="number-dialog" aria-labelledby="number-dialog-title"><form id="number-form" novalidate><div class="dialog-top"><span class="pill" id="number-dialog-card">카드 01</span><button class="close" type="button" aria-label="카드번호 입력창 닫기" id="close-number-dialog">✕</button></div><h2 id="number-dialog-title">카드를 구분해 주세요</h2><p class="number-help">보안을 위해 전체 카드번호 대신 끝 4자리만 공동으로 저장합니다.</p><label for="card-number-input" class="input-label">카드번호 끝 4자리</label><input id="card-number-input" class="number-input" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="예: 1234" autocomplete="off" aria-describedby="number-error"><p id="number-error" role="alert"></p><button class="submit" type="submit">카드번호 저장하기</button></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
